name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `pnpm dev`
        2. Open the Showcase tab
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 1.0.0 or a commit SHA
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - iOS
        - Android
        - Web
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Where does it happen?
      options:
        - Expo Go on a simulator or emulator
        - Expo Go on a physical device
        - Local build (expo run:ios / expo run:android)
        - Web browser
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and OS version
      placeholder: iPhone 17 simulator, iOS 26.5
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Any errors from the Metro terminal or the red error screen.
      render: text
