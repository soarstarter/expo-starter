<!doctype html>
<!--
  GitHub social preview for this repository (Settings → General → Social preview).
  Output: 1280x640, the size GitHub recommends. Self-contained apart from the
  screenshots in ../screenshots/.

  Regenerate the PNG from the repository root:
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless --disable-gpu --hide-scrollbars --force-device-scale-factor=1 \
      --window-size=1280,640 \
      --screenshot=docs/social-preview/social-preview.png \
      "file://$(pwd)/docs/social-preview/social-preview.html"

  Colors follow the iOS tint used in the app (#007aff). The phone frames are
  drawn here; the screenshots are plain iOS Simulator captures.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1280px;
        height: 640px;
      }
      body {
        font-family: -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        color: #fafafa;
        background: #090b10;
        background-image:
          radial-gradient(circle at 92% 8%, rgba(56, 189, 248, 0.22), transparent 42%),
          radial-gradient(circle at 70% 100%, rgba(37, 99, 235, 0.2), transparent 48%),
          linear-gradient(100deg, #07080c 0%, #090b10 50%, #0a1220 100%);
        overflow: hidden;
        position: relative;
      }
      .dots {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(
          circle,
          rgba(56, 189, 248, 0.22) 1.2px,
          transparent 1.2px
        );
        background-size: 24px 24px;
        -webkit-mask-image: radial-gradient(circle at 78% 46%, #000 0%, transparent 46%);
        opacity: 0.35;
      }

      /* left column */
      .left {
        position: absolute;
        left: 72px;
        top: 64px;
        bottom: 60px;
        width: 560px;
        display: flex;
        flex-direction: column;
      }
      .repo {
        display: flex;
        align-items: center;
        gap: 16px;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 22px;
        color: #94a3b8;
      }
      .repo b {
        color: #e2e8f0;
        font-weight: 600;
      }
      .repo img {
        width: 56px;
        height: 56px;
        flex: none;
        border-radius: 13px;
      }
      h1 {
        margin-top: 36px;
        font-size: 76px;
        line-height: 1;
        font-weight: 800;
        letter-spacing: -0.035em;
      }
      h1 span {
        background: linear-gradient(120deg, #60a5fa 0%, #38bdf8 100%);
        -webkit-background-clip: text;
        color: transparent;
      }
      .tagline {
        margin-top: 20px;
        font-size: 27px;
        line-height: 1.35;
        color: #cbd5e1;
        letter-spacing: -0.005em;
      }
      .chips {
        margin-top: 28px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        max-width: 540px;
      }
      .chip {
        font-size: 18px;
        font-weight: 500;
        padding: 8px 14px;
        border-radius: 999px;
        color: #dbeafe;
        background: rgba(37, 99, 235, 0.16);
        border: 1px solid rgba(96, 165, 250, 0.32);
      }
      .foot {
        margin-top: auto;
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 19px;
        color: #94a3b8;
      }
      .foot .mit {
        font-weight: 700;
        color: #0b1220;
        background: #e2e8f0;
        padding: 4px 10px;
        border-radius: 6px;
        font-size: 16px;
        letter-spacing: 0.04em;
      }
      .foot span {
        white-space: nowrap;
      }
      .foot .sep {
        color: #475569;
      }

      /* phones */
      .phone {
        position: absolute;
        width: 182px;
        padding: 7px;
        border-radius: 34px;
        background: #0b0c0f;
        border: 1px solid rgba(148, 163, 184, 0.28);
        box-shadow:
          0 40px 90px rgba(0, 0, 0, 0.6),
          0 0 0 1px rgba(0, 0, 0, 0.5);
      }
      .phone img {
        display: block;
        width: 100%;
        border-radius: 27px;
      }
      .p1 {
        left: 700px;
        top: 150px;
        transform: rotate(-4deg);
      }
      .p2 {
        left: 888px;
        top: 96px;
        z-index: 2;
      }
      .p3 {
        left: 1076px;
        top: 150px;
        transform: rotate(4deg);
      }
    </style>
  </head>
  <body>
    <div class="dots"></div>

    <div class="phone p1"><img src="../screenshots/login.png" alt="" /></div>
    <div class="phone p2"><img src="../screenshots/paywall.png" alt="" /></div>
    <div class="phone p3"><img src="../screenshots/showcase.png" alt="" /></div>

    <div class="left">
      <div class="repo">
        <img src="../../assets/images/icon.png" alt="" />
        <div>soarstarter / <b>expo-starter</b></div>
      </div>

      <h1>Expo<br /><span>Starter</span></h1>
      <p class="tagline">
        An open-source Expo + React Native starter that opens like a finished app.
      </p>

      <div class="chips">
        <span class="chip">Onboarding</span>
        <span class="chip">Sign-in screens</span>
        <span class="chip">Paywall screens</span>
        <span class="chip">Themes &amp; i18n</span>
        <span class="chip">Runs in Expo Go</span>
      </div>

      <div class="foot">
        <span class="mit">MIT</span>
        <span>Expo SDK 58</span><span class="sep">·</span><span>React Native 0.88</span
        ><span class="sep">·</span><span>TypeScript</span><span class="sep">·</span
        ><span>NativeWind</span>
      </div>
    </div>
  </body>
</html>
